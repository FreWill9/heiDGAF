global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus server self-metrics
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter for host/container system metrics
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # (Optional) your Python services instrumented with prometheus_client
  - job_name: python-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - service1:8000
          - service2:8000
          # …etc…

  # (Optional) Kafka JMX exporter
  - job_name: kafka-jmx
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:2323']   # kafka broker
